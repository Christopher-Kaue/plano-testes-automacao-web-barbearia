# Endereco do sistema em TESTE (a copia rodando com "npx next dev -p 3002").
# NUNCA aponte para o site publicado: os testes apagam e recriam os dados.
url.base=http://localhost:3002

# Arquivo .env.local da copia de teste. A conexao do banco (DATABASE_URL) e lida dele,
# para a senha do PostgreSQL nao ficar gravada neste projeto.
sistema.env=../sistema-copia/.env.local

# Senha do dono no painel (igual ao ADMIN_PASSWORD do .env.local da copia).
admin.usuario=admin
admin.senha=SenhaTeste123

# Tempo maximo (segundos) esperando um elemento aparecer na tela.
espera.segundos=15
